<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graficadora</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jsxgraph/1.6.0/jsxgraph.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsxgraph/1.6.0/jsxgraphcore.js"></script>
</head>
<body>
    <div id="jxgbox"></div>

    <div id="selector-metodos">
        <label>
            <input type="radio" name="metodo" value="Bisección" checked>
            Bisección
        </label>
        <label>
            <input type="radio" name="metodo" value="Regula Falsi">
            Regula Falsi
        </label>
        <label>
            <input type="radio" name="metodo" value="Newton-Raphson">
            Newton-Raphson
        </label>
        <label>
            <input type="radio" name="metodo" value="Secante">
            Secante
        </label>
        <label>
            <input type="radio" name="metodo" value="Punto Fijo">
            Punto Fijo
        </label>
    </div>

    <script src="script.js"></script>
</body>
</html>
